name: Deploy plant-protection site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "plant-protection/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  # Бот коммитлари (GITHUB_TOKEN) push-триггерни ишга туширмайди — шунинг учун
  # маълумот/янгилик workflow'лари тугагач сайтни қайта жойлаймиз.
  workflow_run:
    workflows: ["Weather data", "Ўсимликларни ҳимоя — янгиликларни автоматик янгилаш"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: plant-protection

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
