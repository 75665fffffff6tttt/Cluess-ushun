name: Rust spores

# Сариқ занг спораларининг шамол билан тарқалиши (scripts/build-spores.py) → plant-protection/data/spores.json
# Биринчи марта мавсум бошидан архив тўлдирилади (Open-Meteo лимити туфайли 3–4 марта ишга тушириш керак),
# кейин ҳар куни охирги кунлар ва 16 кунлик прогноз.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "weather-data"
  cancel-in-progress: false

jobs:
  spores:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Spore dispersal
        env:
          SPORE_BUDGET: "4500"
          WX_MAX_MINUTES: "100"
        run: python scripts/build-spores.py
      - name: Commit
        run: |
          f=plant-protection/data/spores.json
          [ -f "$f" ] || exit 0
          [ -n "$(git status --porcelain "$f")" ] || { echo "No changes."; exit 0; }
          git config user.name "agro-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "Авто: занг споралари тарқалиши янгиланди (spores.json)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
