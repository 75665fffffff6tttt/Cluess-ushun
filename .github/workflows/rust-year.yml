name: Rust past year

# Ўтган йил учун сариқ занг соатлик маълумоти (архив) → plant-protection/data/rust-YEAR.json
# Масалан: year=2025, from=2025-08-01 (буғдой мавсуми август–август учун).

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Йил"
        default: "2025"
      from:
        description: "Шу санадан (YYYY-MM-DD)"
        default: "2025-08-01"

permissions:
  contents: write

concurrency:
  group: "weather-data"
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Archive (Open-Meteo, paced)
        env:
          RUST_YEAR: ${{ inputs.year }}
          RUST_FROM: ${{ inputs.from }}
          RUST_BUDGET: "4500"
          WX_MAX_MINUTES: "80"
        run: python scripts/update-rust.py
      - name: Commit
        run: |
          f="plant-protection/data/rust-${{ inputs.year }}.json"
          [ -f "$f" ] || exit 0
          git config user.name "agro-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git diff --cached --quiet && exit 0
          git commit -m "Авто: сариқ занг архиви ${{ inputs.year }}"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
